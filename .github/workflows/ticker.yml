name: Distressed-Ticker Feed-Runner

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitfenster in Tagen"
        default: "2"

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feeds abrufen
        run: |
          python sammeln.py --tage "${{ github.event.inputs.tage || 2 }}" --out rohtreffer.json --digest digest
          python sammeln.py --feedcheck > digest/feedcheck.txt || true
      - name: Ergebnis committen
        run: |
          git config user.name "ticker-runner"
          git config user.email "ticker-runner@users.noreply.github.com"
          git add rohtreffer.json digest feed_health.json
          git diff --quiet --cached || git commit -m "Ticker-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
