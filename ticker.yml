name: Distressed-Ticker Feed-Runner

# Laeuft taeglich um 07:40 UTC. Das sind 09:40 deutscher Sommerzeit und 08:40 Winterzeit.
# Der Cowork-Lauf startet um 10:00 deutscher Zeit, es bleiben also mindestens 20 Minuten Puffer.
# Zusaetzlich manuell startbar ueber "Run workflow".
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitfenster in Tagen"
        default: "2"

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds abrufen
        run: |
          python lib/sammeln.py --tage "${{ github.event.inputs.tage || 2 }}" \
            --out rohtreffer.json --digest digest
          python lib/sammeln.py --feedcheck > digest/feedcheck.txt || true

      - name: Ergebnis committen
        run: |
          git config user.name "ticker-runner"
          git config user.email "ticker-runner@users.noreply.github.com"
          git add rohtreffer.json digest feed_health.json
          git diff --quiet --cached || git commit -m "Ticker-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
